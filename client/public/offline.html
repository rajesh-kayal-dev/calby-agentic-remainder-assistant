<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Calby</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(163, 230, 53, 0.1);
      border: 1px solid rgba(163, 230, 53, 0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrap img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background-color: #a3e635;
      color: #09090b;
      font-weight: 600;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #bef264;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="/logo.png" alt="Calby">
    </div>
    <h1>You're Offline</h1>
    <p>Calby requires an active internet connection to organize your schedule, assist with tasks, and sync with your calendar.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
